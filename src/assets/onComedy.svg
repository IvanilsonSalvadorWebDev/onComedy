<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="100%" height="100%">
  <!-- Definições para reaproveitar estilos e variáveis do seu CSS -->
  <style>
    .logo-text-on { font-family: 'Lato', sans-serif; font-weight: 400; fill: #ffffff; font-size: 28px; letter-spacing: -0.5px; }
    .logo-text-comedy { font-family: 'Lato', sans-serif; font-weight: 900; fill: var(--modern-yellow, #facc15); font-size: 28px; letter-spacing: -0.5px; }
    .smile-icon { fill: none; stroke: var(--modern-yellow, #facc15); stroke-width: 4; stroke-linecap: round; }
    .smile-eye { fill: var(--modern-yellow, #facc15); }
  </style>

  <!-- Grupo do Ícone (Sorriso Minimalista + Olhos de "Play") -->
  <g transform="translate(10, 8)">
    <!-- Olho Esquerdo -->
    <circle cx="12" cy="16" r="3.5" class="smile-eye" />
    <!-- Olho Direito -->
    <circle cx="32" cy="16" r="3.5" class="smile-eye" />
    <!-- O Sorriso (Arco perfeito e expressivo) -->
    <path d="M 8 26 A 14 14 0 0 0 36 26" class="smile-icon" />
  </g>

  <!-- Texto do Logotipo (Aproximado do ícone e sem espaço interno) -->
  <g transform="translate(52, 38)">
    <text x="0" y="0" class="logo-text-on">on</text>
    <text x="31" y="0" class="logo-text-comedy">Comedy</text>
  </g>
</svg>
