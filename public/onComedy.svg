<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60" width="220" height="60">
  <rect width="100%" height="100%" fill="#171717"/>
  <style>
    .logo-text-on { font-family: 'Lato', 'Segoe UI', sans-serif; font-weight: 400; fill: #ffffff; font-size: 28px; letter-spacing: -0.5px; }
    .logo-text-comedy { font-family: 'Lato', 'Segoe UI', sans-serif; font-weight: 900; fill: #facc15; font-size: 28px; letter-spacing: -0.5px; }
    .smile-icon { fill: none; stroke: #facc15; stroke-width: 4; stroke-linecap: round; }
    .smile-eye { fill: #facc15; }
  </style>
  <g transform="translate(10, 8)">
    <circle cx="12" cy="16" r="3.5" class="smile-eye" />
    <circle cx="32" cy="16" r="3.5" class="smile-eye" />
